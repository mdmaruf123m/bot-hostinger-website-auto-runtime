<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050217"><title>MY HOST PANEL · Hosting overview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{color-scheme:dark;--bg:#050217;--surface:#100d2b;--soft:#17133a;--primary:#0D0782;--accent:#716aff;--text:#f4f1ff;--muted:#aaa4cb;--line:#2a2458;--danger:#ff657d;--ok:#a49eff;--shadow:0 14px 40px #0006}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px 18px 80px;background:radial-gradient(circle at 12% 0%,#0d0782c7,transparent 42%),linear-gradient(145deg,#0D0782,#050217 68%);background-attachment:fixed;color:var(--text);font:14px system-ui,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto}.bar,.card,.stat,.modal{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:16px;margin-bottom:20px}.bar b{color:#c8c4ff}.bar a{color:var(--danger);text-decoration:none}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 2px 16px}.heading h1{font-size:clamp(24px,5vw,32px);margin:0}.heading p,.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{padding:14px;border-radius:15px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{font-size:24px}.upload{border:2px dashed #716aff99;text-align:center;padding:22px;border-radius:18px;margin-bottom:18px;background:#100d2bcc}.upload p{font-size:12px;color:var(--muted);line-height:1.6}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border:0;border-radius:10px;text-decoration:none;font-weight:750;color:white;cursor:pointer;background:linear-gradient(135deg,#0D0782,#463be0)}.btn:disabled{opacity:.6}.outline{background:var(--surface);border:1px solid #49427c}.danger{background:#9d2840}.small{padding:7px 9px;font-size:12px}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar input,.toolbar select{padding:10px;border-radius:10px;background:var(--surface);color:var(--text);border:1px solid var(--line)}.toolbar input{flex:1;min-width:0}.card{padding:15px;border-radius:17px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:800;word-break:break-word}.pill{font-size:10px;border:1px solid #625bd2;border-radius:20px;padding:4px 9px;color:var(--ok)}.pill.off{color:var(--danger);border-color:#8e3d55}.meta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}.toggles{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}.toggles label{font-size:12px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.actions .btn{font-size:12px;padding:8px 4px}.empty{text-align:center;padding:32px;color:var(--muted)}.modal-bg{display:none;position:fixed;inset:0;background:#030211cc;z-index:10;align-items:center;justify-content:center;padding:15px}.modal{width:min(100%,620px);max-height:88vh;overflow:auto;padding:18px;border-radius:16px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.x{cursor:pointer;color:var(--danger);font-size:22px}.log{white-space:pre-wrap;word-break:break-word;background:#08061b;color:#c6c1ff;padding:12px;border-radius:10px;max-height:55vh;overflow:auto;font:12px monospace}.file{padding:9px;margin:5px 0;background:var(--soft);border-radius:8px;cursor:pointer}.editor{width:100%;height:45vh;background:#08061b;color:#e1deff;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px monospace}.error{color:#ffb2c0}@media(max-width:560px){body{padding:12px 12px 70px}.heading{align-items:start;flex-direction:column}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:19px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.actions{grid-template-columns:repeat(2,1fr)}}

/* Unified icon and text palette */
.fa-solid,.fa-regular,.fa-brands{color:var(--accent)}
.btn i{color:currentColor}.btn.outline i{color:#a49eff}.btn.danger i{color:#ffd1d8}
.bar>span>i{color:#a49eff}.bar a i{color:var(--danger)}
.upload>i{color:#a49eff!important}.heading h1,.stat strong,.name{color:var(--text)}
.btn{transition:filter .15s ease,transform .15s ease}.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a49eff;outline-offset:2px}
.pill{color:#c9c5ff}.pill.off{color:#ff9caf}.meta,.toggles label{color:#c1bbdf}
</style></head>
<body><main class="wrap">
<header class="bar"><span><i class="fa-solid fa-circle-user"></i> <b id="userName">Loading…</b></span><a href="#" id="logout" title="Sign out"><i class="fa-solid fa-power-off"></i> Sign out</a></header>
<section class="heading"><div><h1>Hosting overview</h1><p class="muted">Manage your Python, Node.js, and PHP bots.</p></div><button class="btn outline" onclick="loadApps()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button></section>
<section class="stats"><div class="stat"><span>Total apps</span><strong id="total">0</strong></div><div class="stat"><span>Running</span><strong id="running">0</strong></div><div class="stat"><span>Offline</span><strong id="offline">0</strong></div></section>
<section class="upload"><i class="fa-solid fa-cloud-arrow-up" style="font-size:26px;color:#aaa4ff"></i><p>Upload a ZIP archive (up to 100 MB through Cloudflare Free). Python, Node.js and PHP are detected automatically. The runner and bot processes remain on BotKeep.</p><input id="zip" type="file" accept=".zip" hidden><button class="btn" onclick="document.getElementById('zip').click()"><i class="fa-solid fa-upload"></i> Choose ZIP</button><div id="uploadStatus" class="muted" style="margin-top:10px"></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="Search your apps"><select id="filter"><option value="all">All statuses</option><option value="running">Running</option><option value="offline">Offline</option></select></div>
<section id="apps"><div class="empty">Loading your apps…</div></section>
</main>
<div class="modal-bg" id="modal"><section class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><span class="x" onclick="closeModal()">&times;</span></div><div id="modalBody" style="margin-top:14px"></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCaMi91Dp6s7ydrKMO4DwfWcJXMaViG_d4",authDomain:"bot-36914.firebaseapp.com",projectId:"bot-36914",storageBucket:"bot-36914.firebasestorage.app",messagingSenderId:"365558992881",appId:"1:365558992881:web:cb801e341311d54685be50"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();let apps=[],currentProject="",currentFile="",logTimer=null;
async function api(path,options={}){const r=await fetch('/backend/'+path.replace(/^\//,''),{credentials:'same-origin',...options});const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{}}catch(_){const detail=raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,180);throw Error(`Backend returned a non-JSON response (HTTP ${r.status}). ${detail||'Check that BotKeep is online and updated.'}`)}if(r.status===401){await auth.signOut().catch(()=>{});location.href='/login/';throw Error('Your BotKeep session expired. Please log in again.')}if(!r.ok)throw Error(data.error||'Request failed ('+r.status+')');return {r,data}}
auth.onAuthStateChanged(async user=>{if(!user){location.replace('/login/');return}document.getElementById('userName').textContent=user.displayName||user.email;loadApps()});
document.getElementById('logout').onclick=async e=>{e.preventDefault();try{await api('logout')}catch(_){}await auth.signOut().catch(()=>{});location.replace('/login/')};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadApps(){try{const {data}=await api('api/apps');apps=data.apps||[];renderApps()}catch(e){document.getElementById('apps').innerHTML='<div class="empty error">'+esc(e.message)+'<br>Confirm BotKeep is online and the Pages BACKEND_ORIGIN is set.</div>'}}
function renderApps(){const run=apps.filter(a=>a.running).length;document.getElementById('total').textContent=apps.length;document.getElementById('running').textContent=run;document.getElementById('offline').textContent=apps.length-run;const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const items=apps.filter(a=>(!q||a.name.toLowerCase().includes(q))&&(f==='all'||(f==='running')===a.running));document.getElementById('apps').innerHTML=items.length?items.map(a=>`<article class="card"><div class="top"><span class="name">${esc(a.name)}</span><span class="pill ${a.running?'':'off'}">${a.running?'RUNNING':'OFFLINE'}</span></div><div class="meta"><span>${esc(a.device||'—')}</span>${a.running?`<span>Runs for ${esc(a.remaining_run_min)}m</span>`:''}</div><div class="toggles"><label><input type="checkbox" ${a.auto_on?'checked':''} onchange="toggle('${esc(a.name)}','auto_on',this)"> Auto-On</label><label><input type="checkbox" ${a.auto_restart?'checked':''} onchange="toggle('${esc(a.name)}','auto_restart',this)"> Auto-Restart</label></div><div class="actions">${a.running?`<button class="btn danger" onclick="stopApp('${esc(a.name)}')"><i class="fa-solid fa-stop"></i> Stop</button><button class="btn outline" onclick="restartApp('${esc(a.name)}')"><i class="fa-solid fa-rotate-right"></i> Restart</button>`:`<button class="btn" onclick="runApp('${esc(a.name)}')"><i class="fa-solid fa-play"></i> Run</button><button class="btn outline" onclick="validateApp('${esc(a.name)}')"><i class="fa-solid fa-circle-check"></i> Validate</button>`}<button class="btn outline" onclick="showLogs('${esc(a.name)}')"><i class="fa-solid fa-terminal"></i> Logs</button><button class="btn outline" onclick="showFiles('${esc(a.name)}')"><i class="fa-solid fa-folder-open"></i> Files</button><button class="btn outline" onclick="editEnvironment('${esc(a.name)}')"><i class="fa-solid fa-key"></i> Env Vars</button><a class="btn outline" href="/backend/download/${encodeURIComponent(a.name)}"><i class="fa-solid fa-download"></i> Download</a><button class="btn outline" onclick="publicLink('${esc(a.name)}')"><i class="fa-solid fa-link"></i> Public Link</button><button class="btn danger" onclick="deleteApp('${esc(a.name)}')"><i class="fa-solid fa-trash"></i> Delete</button></div></article>`).join(''):'<div class="empty">No apps match your search, or no bots have been uploaded yet.</div>'}
document.getElementById('search').oninput=renderApps;document.getElementById('filter').onchange=renderApps;setInterval(loadApps,60000);
document.getElementById('zip').onchange=e=>{const file=e.target.files[0];if(file)upload(file,false)};
function upload(file,overwrite){const form=new FormData();form.append('file',file,file.name);if(overwrite)form.append('overwrite','true');const status=document.getElementById('uploadStatus');status.textContent='Uploading…';const xhr=new XMLHttpRequest();xhr.open('POST','/backend/upload');xhr.withCredentials=true;xhr.upload.onprogress=e=>{if(e.lengthComputable)status.textContent='Uploading… '+Math.round(e.loaded/e.total*100)+'%'};xhr.onload=async()=>{let d={};try{d=JSON.parse(xhr.responseText)}catch(_){}if(d.needs_confirm){if(confirm(d.error+' Overwrite?'))upload(file,true);else status.textContent='';return}if(!d.ok){status.textContent=d.error||'Upload failed';return}status.textContent='Uploaded '+(d.kind||'project')+'.';await loadApps()};xhr.onerror=()=>status.textContent='Network error';xhr.send(form)}
async function runApp(n){const card=[...document.querySelectorAll('.card')].find(x=>x.querySelector('.name')?.textContent===n);const button=card?.querySelector('.actions .btn');if(button){button.disabled=true;button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Starting…'}try{const {data}=await api('run/'+encodeURIComponent(n)+'?json=1');if(!data.ok)throw Error(data.error||'Could not start the bot');await new Promise(resolve=>setTimeout(resolve,500));await loadApps();const status=apps.find(a=>a.name===n);if(!status?.running)throw Error('The process stopped just after launch. Open Logs for the startup error.');await Swal.fire({title:'Bot is running',text:'Started on BotKeep.',icon:'success',confirmButtonColor:'#463be0'})}catch(e){await loadApps();Swal.fire({title:'Could not start',text:e.message,icon:'error',confirmButtonColor:'#463be0'})}finally{if(button){button.disabled=false;button.innerHTML='<i class="fa-solid fa-play"></i> Run'}}}async function stopApp(n){try{await api('stop/'+encodeURIComponent(n)+'?json=1');loadApps()}catch(e){Swal.fire('Error',e.message,'error')}}async function restartApp(n){try{const {data}=await api('restart/'+encodeURIComponent(n)+'?json=1');if(!data.ok)throw Error(data.error||'Restart failed');loadApps()}catch(e){Swal.fire('Failed',e.message,'error')}}async function toggle(n,f,el){try{const {data}=await api('toggle_'+f+'/'+encodeURIComponent(n),{method:'POST'});if(!data.ok)throw Error('Unable to save setting')}catch(e){el.checked=!el.checked;Swal.fire('Error',e.message,'error')}}
async function validateApp(n){showModal('Validation · '+n,'Checking…');try{const {data}=await api('validate/'+encodeURIComponent(n));document.getElementById('modalBody').innerHTML=data.ok?'<p>Everything looks good. Entry: '+esc(data.entry||'found')+'</p>':(data.problems||[]).map(p=>'<p class="error"><b>'+esc(p.file)+'</b> '+esc(p.error)+'</p>').join('')||'<p class="error">'+esc(data.error||'Validation failed')+'</p>'}catch(e){document.getElementById('modalBody').textContent=e.message}}
function showModal(t,html){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none';if(logTimer)clearInterval(logTimer)}
async function editEnvironment(n){currentProject=n;showModal('Environment Variables · '+n,'<p class="muted">Values are encrypted at rest and never shown again after saving. Add a name/value pair; for Telegram use <code>TELEGRAM_BOT_TOKEN</code>. Restart this app after changes.</p><div id="envList">Loading…</div><hr style="border-color:var(--line);margin:16px 0"><label class="muted">Variable name</label><input id="envName" autocomplete="off" placeholder="TELEGRAM_BOT_TOKEN" style="display:block;width:100%;margin:6px 0 12px;padding:10px;border-radius:9px;background:#08061b;color:var(--text);border:1px solid var(--line)"><label class="muted">Value (secret)</label><input id="envValue" type="password" autocomplete="new-password" placeholder="Paste secret value" style="display:block;width:100%;margin:6px 0 12px;padding:10px;border-radius:9px;background:#08061b;color:var(--text);border:1px solid var(--line)"><button class="btn" onclick="saveEnvironment()"><i class="fa-solid fa-lock"></i> Save securely</button> <span id="envStatus" class="muted"></span>');await refreshEnvironment()}
async function refreshEnvironment(){try{const {data}=await api('api/apps/'+encodeURIComponent(currentProject)+'/env');const list=document.getElementById('envList');if(list)list.innerHTML=(data.variables||[]).map(v=>`<div class="file" style="display:flex;justify-content:space-between;align-items:center"><code>${esc(v)}</code><button class="btn danger small" onclick="deleteEnvironment('${esc(v)}')" title="Delete variable"><i class="fa-solid fa-trash"></i> Remove</button></div>`).join('')||'<p class="muted">No variables saved for this app yet.</p>'}catch(e){const list=document.getElementById('envList');if(list)list.textContent=e.message}}
async function saveEnvironment(){const name=document.getElementById('envName').value.trim(),value=document.getElementById('envValue').value,status=document.getElementById('envStatus');if(!name||!value){status.textContent='Enter both a variable name and value.';return}try{const {data}=await api('api/apps/'+encodeURIComponent(currentProject)+'/env',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,value})});document.getElementById('envValue').value='';status.textContent=data.message||'Saved. Restart the app for it to take effect.';await refreshEnvironment()}catch(e){status.textContent=e.message}}
async function deleteEnvironment(name){if(!confirm('Remove '+name+' from this app?'))return;try{await api('api/apps/'+encodeURIComponent(currentProject)+'/env?name='+encodeURIComponent(name),{method:'DELETE'});await refreshEnvironment()}catch(e){Swal.fire('Error',e.message,'error')}}
async function showLogs(n){showModal('Logs · '+n,'<pre class="log" id="logContent">Loading…</pre>');async function refresh(){try{const {data}=await api('get_log/'+encodeURIComponent(n));const el=document.getElementById('logContent');if(el)el.textContent=data.log||'(No logs available yet)'}catch(e){const el=document.getElementById('logContent');if(el)el.textContent=e.message}}await refresh();if(logTimer)clearInterval(logTimer);logTimer=setInterval(refresh,3000)}
async function publicLink(n){try{const {data}=await api('get_public_link/'+encodeURIComponent(n),{method:'POST'});if(data.ok)await Swal.fire({title:'Public link',html:`<input readonly style="width:100%;padding:10px" value="${esc(data.url)}" onclick="this.select()">`});else throw Error(data.error||'Could not create link')}catch(e){Swal.fire('Error',e.message,'error')}}
async function deleteApp(n){if(!confirm('Delete '+n+' permanently?'))return;try{await api('delete/'+encodeURIComponent(n));await loadApps()}catch(e){Swal.fire('Error',e.message,'error')}}
async function showFiles(n){currentProject=n;showModal('Files · '+n,'Loading…');try{const {data}=await api('list_files/'+encodeURIComponent(n));document.getElementById('modalBody').innerHTML=(data.files||[]).map(f=>`<div class="file" onclick="editFile('${esc(f)}')">${esc(f)}</div>`).join('')||'<p class="muted">No files found.</p>'}catch(e){document.getElementById('modalBody').textContent=e.message}}
async function editFile(f){currentFile=f;try{const {data}=await api('read_file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:currentProject,filename:f})});document.getElementById('modalBody').innerHTML=`<p>${esc(f)}</p><textarea id="editor" class="editor">${esc(data.content||'')}</textarea><p><button class="btn" onclick="saveFile()">Save</button> <button class="btn danger" onclick="removeFile()">Delete file</button> <button class="btn outline" onclick="showFiles('${esc(currentProject)}')">Back</button></p>`}catch(e){Swal.fire('Error',e.message,'error')}}async function saveFile(){const content=document.getElementById('editor').value;const {data}=await api('save_file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:currentProject,filename:currentFile,content})});if(data.status==='success')Swal.fire({title:'Saved',icon:'success',timer:900,showConfirmButton:false});else Swal.fire('Error',data.error||'Save failed','error')}async function removeFile(){if(!confirm('Delete this file?'))return;await api('delete_file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:currentProject,filename:currentFile})});showFiles(currentProject)}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
</script></body></html>
