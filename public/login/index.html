<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050217"><title>Log in · Bot Hosting Panel</title><style>:root{color-scheme:dark;--text:#f4f1ff;--muted:#aaa4cb;--line:#2a2458}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 14% 3%,#0d0782d9,transparent 42%),linear-gradient(145deg,#0D0782,#050217 68%);font-family:system-ui,"Segoe UI",sans-serif;color:var(--text)}main{width:min(100%,420px);padding:30px;border:1px solid var(--line);border-radius:24px;background:#100d2bf2;box-shadow:0 24px 70px #0008}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#716aff,#0D0782);font-size:23px;font-weight:900}h1{margin:18px 0 5px;font-size:25px}p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{height:48px;border:1px solid #39336c;border-radius:12px;background:#08061b;color:var(--text);padding:0 14px;font-size:15px}button{height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#0D0782,#463be0);color:#fff;font-size:15px;font-weight:800;cursor:pointer}.error{display:none;padding:11px;border:1px solid #9f3c56;border-radius:11px;background:#3a1224;color:#ffd7df;font-size:13px}.foot{margin-top:20px;text-align:center;font-size:13px}.foot a{color:#aaa4ff;font-weight:800;text-decoration:none}.hint{margin-top:16px;font-size:11px;color:#837da7;text-align:center}</style></head><body><main><div class="mark">B</div><h1>Log in</h1><p>Sign in with your Firebase account to manage your hosted bots.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required maxlength="254"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><div id="error" class="error" role="alert"></div><button id="submit">Log in</button></form><div class="foot">New here? <a href="/register/">Create an account</a></div><div class="hint">Authentication is handled by Firebase.</div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDyfJQlCeLCUf09DSJxwYKoIEMfJ0-AOMY",authDomain:"email-b10d2.firebaseapp.com",databaseURL:"https://email-b10d2-default-rtdb.firebaseio.com",projectId:"email-b10d2",storageBucket:"email-b10d2.firebasestorage.app",messagingSenderId:"244667224878",appId:"1:244667224878:web:76076f744928ab505ce0bf"});const auth=firebase.auth(),form=document.getElementById('form'),btn=document.getElementById('submit'),err=document.getElementById('error');auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});function show(s){err.textContent=s;err.style.display='block'}async function enter(user){const r=await fetch('/backend/auth/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:await user.getIdToken()})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Could not start panel session');location.replace('/')}form.onsubmit=async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Signing in…';try{const c=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);await enter(c.user)}catch(x){await auth.signOut().catch(()=>{});show(x.message||'Login failed');btn.disabled=false;btn.textContent='Log in'}};</script></body></html>
